server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PWA : SW à la racine, jamais cacher
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        # Sans ce type, le manifeste part en application/octet-stream et
        # certains navigateurs refusent de l'interpréter.
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets buildés (hash) → cache long
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
