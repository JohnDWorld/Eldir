<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `interactive-widget=resizes-content` : sans lui, le clavier tactile ne
         rétrécit PAS la vue de mise en page (le défaut est `resizes-visual`).
         L'app est en `height: 100%` d'une vue qui n'a pas bougé, donc le
         composeur de la page de session, qui vit en bas, passait SOUS le
         clavier. Or écrire à Claude est le geste le plus fréquent de l'app sur
         un téléphone. Avec cette clé, la vue rétrécit, les 100% rétrécissent
         avec elle, et le composeur reste au-dessus du clavier avec son bouton.
         C'est une amélioration progressive : un navigateur qui ne connaît pas
         la clé l'ignore et se comporte comme avant. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#D97757" />
    <!-- Thème appliqué avant le premier affichage : sans ça, la PWA s'ouvre
         en clair puis bascule en sombre (flash blanc). Même clé et même
         logique que src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('eldir.theme');
          var dark =
            p === 'dark' ||
            (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#262422');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eldir" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Fonts (Inter + JetBrains Mono - DA D1) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <title>Eldir</title>
    <meta
      name="description"
      content="Hub multi-agents Claude pour orchestrer plusieurs sessions Claude Code en parallèle sur tes repos."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
