name: frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  lint-and-test:
    name: eslint · tsc · vitest · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Vitest
        run: npm test -- --run

      - name: Build (PWA)
        run: npm run build
