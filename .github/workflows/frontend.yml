name: frontend

# `backend/app/core/constants.py` : le fil lit les origines de message que le
# backend écrit, et un test du frontend compare les deux (session-page.test.tsx).
# Sans ce chemin, une PR qui ne change que cette constante ne lancerait pas ce
# test, et la dérive passerait la CI.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/app/core/constants.py'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/app/core/constants.py'

jobs:
  lint-and-test:
    name: eslint · tsc · vitest · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Vitest
        run: npm test -- --run

      - name: Build (PWA)
        run: npm run build

      # Lighthouse portait cette garantie jusqu'à sa version 11. La 12 a
      # supprimé la catégorie PWA et ses audits sans remplacement : sans ce
      # pas, plus rien ne vérifie que l'app reste installable.
      - name: Installable (manifeste, service worker, icônes)
        run: npm run verifie-pwa
