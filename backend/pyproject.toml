[project]
name = "eldir-backend"
version = "0.1.0"
description = "Eldir - backend FastAPI orchestrant les sessions Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "John Demory", email = "j.demory40@gmail.com" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0,<5.0",
    "httpx>=0.27.2",
    "websockets>=13.1",
    "claude-agent-sdk>=0.1.0",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "asgi-lifespan>=2.1.0",
    "aiosqlite>=0.20.0",
    "types-passlib>=1.7.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "ASYNC",         # flake8-async
    "S",             # bandit
    "C4",            # comprehensions
    "RET",           # return
    "SIM",           # simplify
    "TID",           # tidy-imports
    "PL",            # pylint subset
    "RUF",           # ruff-specific
]
ignore = [
    "S101",    # asserts in tests are fine
    "PLR0913",
    # Imports différés assumés : `claude_agent_sdk` n'est chargé qu'au boot
    # d'une session, et plusieurs services s'importent tard pour casser des
    # cycles. Cf. les commentaires aux appels concernés.
    "PLC0415",
    # Comparaisons à de petits entiers en parsant des sorties de commandes
    # (nombre de champs d'une ligne git) : nommer ces constantes n'apporte
    # rien de lisible.
    "PLR2004",
    # PEP 695 (`class Page[T]`) : à reprendre quand Pydantic v2 le supportera
    # partout dans nos schémas génériques.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PLR2004"]
"alembic/**" = ["E501", "N806"]
# Singletons de process : le `global` est le pattern, pas un accident.
"app/services/singletons.py" = ["PLW0603"]
# Champs Pydantic pris pour des attributs de classe mutables.
"app/schemas/**" = ["RUF012"]
# Faux positifs bandit : ce sont des noms de constantes et des libellés,
# pas des secrets ("token_type", "GITHUB_ACCESS_TOKEN_URL", "token_marker").
"app/schemas/auth.py" = ["S105"]
"app/schemas/setup.py" = ["S105"]
"app/services/github_oauth_service.py" = ["S105"]
"app/core/bootstrap.py" = ["S106"]
# Exception de signalement, volontairement nommée Warning : elle alerte,
# elle ne bloque jamais (cf. principe directeur n°5).
"app/core/exceptions.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*", "passlib.*", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py", "alembic/*"]

[tool.coverage.report]
# Seuil aligné sur la réalité mesurée (58%), pas sur l'objectif. Un seuil
# jamais atteint est un seuil que tout le monde apprend à ignorer, et il
# masque les vraies régressions. À remonter par paliers : chaque PR qui
# ajoute des tests peut relever ce chiffre. Cible ROADMAP : 70%.
fail_under = 57
show_missing = true
skip_covered = true
