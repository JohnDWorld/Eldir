# SOPS - chiffrement des fichiers d'environnement versionnés.
#
# Convention de nommage (pour que SOPS reconnaisse le format dotenv des deux
# côtés, sans drapeau à retenir) :
#
#   secrets/<nom>.env        en clair, gitignoré, jamais poussé
#   secrets/<nom>.enc.env    chiffré avec age, committé
#
#   ./scripts/secrets.sh encrypt   # .env      -> .enc.env
#   ./scripts/secrets.sh decrypt   # .enc.env  -> .env
#   ./scripts/secrets.sh deploy    # déchiffre et pousse sur le serveur en SSH
#
# Ajouter un destinataire (autre machine, autre mainteneur) : ajouter sa clé
# publique age ci-dessous, puis `sops updatekeys secrets/<nom>.enc.env`.

creation_rules:
  - path_regex: secrets/.*\.env$
    age: >-
      age15hqx6yuggg3wu442cjqs0mzspmmuz8utsaaseujspkg6m2flrvcqxzv8dt
